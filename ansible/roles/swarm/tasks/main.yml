---
- name: Inicializar Swarm en el Manager
  shell: docker swarm init --advertise-addr {{ ansible_facts['default_ipv4']['address'] }}
  when: "'managers' in group_names"
  register: swarm_init
  ignore_errors: true

- name: Obtener el Join Token del Manager
  shell: docker swarm join-token -q worker
  when: "'managers' in group_names"
  register: worker_token

- name: Unir Workers al Cluster
  shell: "docker swarm join --token {{ hostvars[groups['managers'][0]]['worker_token']['stdout'] }} {{ hostvars[groups['managers'][0]]['ansible_facts']['default_ipv4']['address'] }}:2377"
  when: "'workers' in group_names"
  ignore_errors: true