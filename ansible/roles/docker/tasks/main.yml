---
- name: Instalar dependencias iniciales
  apt:
    name: [cloud-utils, apt-transport-https, ca-certificates, curl, software-properties-common]
    state: present
    update_cache: yes

- name: Añadir clave GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Añadir repositorio de Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present

- name: Instalar Docker CE
  apt:
    name: docker-ce
    state: present
    update_cache: yes

- name: Añadir usuario ubuntu al grupo docker
  user:
    name: ubuntu
    groups: docker
    append: yes